name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    name: Prepare or create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # A PAT allows Release Please pull requests to trigger CI. The built-in
          # token remains a functional fallback for repositories without one.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main

  goreleaser:
    name: Publish release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: true

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          args: check

      - name: Upload release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build Podman image (${{ matrix.arch }})
    needs:
      - release-please
      - goreleaser
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Build and push architecture image
        env:
          REGISTRY_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | podman login --username "$REGISTRY_USER" --password-stdin docker.io
          image="docker.io/nemirlev/zenexport:${RELEASE_TAG}-${ARCH}"
          podman build -f podman/Containerfile -t "$image" .
          podman push "$image"

  image-manifest:
    name: Publish multi-architecture image
    needs: [release-please, image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Publish manifest
        env:
          REGISTRY_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | podman login --username "$REGISTRY_USER" --password-stdin docker.io
          podman manifest create zenexport-release
          podman manifest add zenexport-release "docker://docker.io/nemirlev/zenexport:${RELEASE_TAG}-amd64"
          podman manifest add zenexport-release "docker://docker.io/nemirlev/zenexport:${RELEASE_TAG}-arm64"
          podman manifest push --all zenexport-release "docker://docker.io/nemirlev/zenexport:${RELEASE_TAG}"
          podman manifest push --all zenexport-release docker://docker.io/nemirlev/zenexport:latest
