services:
    app:
        image: "${ZENEXPORT_IMAGE:-localhost/zenexport:local}"
        build:
            context: ..
            dockerfile: podman/Containerfile
        pull_policy: "${ZENEXPORT_PULL_POLICY:-build}"
        environment:
            DB_URL: "${DB_URL:?Set DB_URL to the internal PostgreSQL connection URL}"
            DB_TYPE: postgres
            ZEN_API_TOKEN: "${ZEN_API_TOKEN:?Set ZEN_API_TOKEN to your ZenMoney API token}"
            ZEN_MAX_RESPONSE_SIZE_MB: "${ZEN_MAX_RESPONSE_SIZE_MB:-256}"
        depends_on:
            postgres:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
    postgres:
        image: docker.io/library/postgres:18.6-alpine3.23
        environment:
            POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
        volumes:
            # PostgreSQL 18+ stores versioned clusters below this directory.
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -q -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
    migrations:
        image: docker.io/migrate/migrate:v4.19.1
        volumes:
            - ../migrations/postgres:/migrations:ro,z
        depends_on:
            postgres:
                condition: service_healthy
        command:
            - -path=/migrations/
            - -database=${DB_URL:?Set DB_URL to the internal PostgreSQL connection URL}
            - up

volumes:
    postgres_data:
